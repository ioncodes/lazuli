[workspace]
resolver = "3"
members = [
  "crates/color",
  "crates/cores",
  "crates/disks",
  "crates/dspint",
  "crates/gekko",
  "crates/gxtex",
  "crates/jitalloc",
  "crates/jitclif",
  "crates/lazuli",
  "crates/modules",
  "crates/ppcjit",
  "crates/renderer",
  "crates/util",
  "crates/vtxjit",

  "crates/app",
  # binaries
  "crates/cubetool",
  "crates/ipl-hle",
]
default-members = [
  "crates/color",
  "crates/cores",
  "crates/disks",
  "crates/dspint",
  "crates/gekko",
  "crates/gxtex",
  "crates/jitalloc",
  "crates/jitclif",
  "crates/lazuli",
  "crates/modules",
  "crates/ppcjit",
  "crates/renderer",
  # libraries
  "crates/util",
  "crates/vtxjit",

  # binaries
  "crates/app",
]

[workspace.dependencies]
color = { path = "./crates/color" }
cores = { path = "./crates/cores" }
disks = { path = "./crates/disks" }
dspint = { path = "./crates/dspint" }
gekko = { path = "./crates/gekko" }
gxtex = { path = "./crates/gxtex" }
jitalloc = { path = "./crates/jitalloc" }
jitclif = { path = "./crates/jitclif" }
lazuli = { path = "./crates/lazuli" }
modules = { path = "./crates/modules" }
ppcjit = { path = "./crates/ppcjit" }
renderer = { path = "./crates/renderer" }
# workspace crates
util = { path = "./crates/util" }
vtxjit = { path = "./crates/vtxjit" }

# actual dependencies
binrw = { version = "0.15", default-features = false, features = ["std"] }
bitos = { git = "https://github.com/vxpm/bitos.git", features = ["zerocopy"] }
bitut = { git = "https://github.com/vxpm/bitut.git" }
bitvec = "1.0"
bytesize = "2"
clap = { version = "4.5", features = ["derive"] }
cranelift = { version = "0.135", features = ["frontend", "native"] }
cranelift-codegen = {
  version = "0.135",
  default-features = false,
  features = [
    "enable-serde",
    "host-arch",
    "std",
    "unwind",
  ]
}
easyerr = "0.1"
eyre-pretty = { git = "https://github.com/vxpm/eyre-pretty.git" }
glam = { version = "0.33", features = ["zerocopy"] }
indexmap = "2"
insta = "1.46"
libc = "0.2"
nanorand = { version = "0.8", default-features = false, features = ["tls"] }
oneshot = { version = "0.2", default-features = false, features = ["std"] }
ordered-float = "5"
powerpc = "0.4"
ring-arena = { git = "https://github.com/vxpm/ring-arena.git" }
rustc-hash = "2"
rustix = { version = "1.1", features = ["mm"] }
seq-macro = "0.3"
serde = { version = "1", features = ["derive"] }
static_assertions = "1.1"
strum = { version = "0.28", features = ["derive"] }
tinyvec = { version = "1.10", features = ["alloc"] }
tracing = {
  version = "0.1",
  default-features = false,
  features = [
    "release_max_level_info",
    "std",
  ]
}
tracing-subscriber = {
  version = "0.3",
  default-features = false,
  features = [
    "ansi",
    "env-filter",
  ]
}
twox-hash = {
  version = "2.1",
  default-features = false,
  features = [
    "std",
    "xxhash3_64",
    "xxhash3_128",
  ]
}
wesl = {
  version = "0.4.4",
  default-features = false,
  features = [
    "eval",
    "naga-ext",
  ]
}
wesl-quote = {
  version = "0.4.4",
}
wgpu = { version = "30.0", default-features = false, features = ["counters"] }
windows = {
  version = ">=0.59",
  features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
  ]
}
zerocopy = { version = "0.8", features = ["derive"] }
zstd = { version = "0.14", default-features = false, features = ["arrays"] }

# lints
[workspace.lints.clippy]
new_without_default = "allow"

assigning_clones = "warn"
bool_to_int_with_if = "warn"
borrow_as_ptr = "warn"
case_sensitive_file_extension_comparisons = "warn"
cast_ptr_alignment = "warn"
checked_conversions = "warn"
cloned_instead_of_copied = "warn"
copy_iterator = "warn"
default_union_representation = "warn"
deref_by_slicing = "warn"
doc_link_with_quotes = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
equatable_if_let = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
format_push_string = "warn"
if_then_some_else_none = "warn"
ignored_unit_patterns = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
large_digit_groups = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
len_without_is_empty = "allow"
linkedlist = "warn"
literal_string_with_formatting_args = "allow"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
mismatching_type_param_order = "warn"
mut_mut = "warn"
mutex_atomic = "warn"
needless_bitwise_bool = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_raw_string_hashes = "warn"
needless_raw_strings = "warn"
negative_feature_names = "warn"
no_mangle_with_rust_abi = "warn"
non_send_fields_in_send_ty = "warn"
option_option = "warn"
ptr_cast_constness = "warn"
range_minus_one = "warn"
rc_mutex = "warn"
redundant_else = "warn"
redundant_feature_names = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
string_add = "warn"
string_add_assign = "warn"
string_lit_chars_any = "warn"
transmute_ptr_to_ptr = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_box_returns = "warn"
unnecessary_join = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unreadable_literal = "warn"
unsafe_derive_deserialize = "warn"
unused_async = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[profile.dev]
panic = "unwind"
codegen-units = 384

[profile.dev.package."binrw"]
opt-level = 2

# workspace crates
[profile.dev.package."disks"]
opt-level = 2

[profile.dev.package."dspint"]
opt-level = 2

[profile.dev.package."gekko"]
opt-level = 2

[profile.dev.package."glam"]
opt-level = 2

[profile.dev.package."gxtex"]
opt-level = 3

[profile.dev.package."lazuli"]
opt-level = 2

[profile.dev.package."moxcms"]
opt-level = 0
debug = false

[profile.dev.package."naga"]
opt-level = 1

[profile.dev.package."ppcjit"]
opt-level = 2

[profile.dev.package."renderer"]
opt-level = 2

[profile.dev.package."util"]
opt-level = 3

[profile.dev.package."wayland-protocols"]
opt-level = 0

[profile.dev.package."wgpu"]
opt-level = 2

[profile.dev.package."wgpu-core"]
opt-level = 2
debug-assertions = false

[profile.dev.package."x11rb-protocol"]
opt-level = 0

[profile.dev.package."zerocopy"]
opt-level = 2

[profile.release]
opt-level = 3
debug = "line-tables-only"
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = "unwind"
incremental = true
codegen-units = 16
rpath = false

[profile.release-dist]
inherits = "release"
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
